<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic OBS · local Browser Source</title><link rel="stylesheet" href="style.css"><style>html,body{width:100%;height:100%;background:transparent;overflow:hidden}#source{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}.stage .show-name{font-size:2vw}.stage .count{font-size:12vw}.stage .reveal{font-size:6vw}.stage .kicker{font-size:1.4vw}</style><div id="source" class="stage overlay"></div><script src="stage.js"></script><script>let state=null;async function poll(){try{state=await(await fetch('/api/state')).json()}catch(e){document.getElementById('source').textContent='Local source disconnected'}}setInterval(()=>{if(state)paintStage(document.getElementById('source'),state.program,state.program_started,{overlay:true,fallback:state.restore?state.restore.show:null})},100);setInterval(poll,300);poll();</script></html>
