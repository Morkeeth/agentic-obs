<!doctype html><html lang="en"><meta charset="utf-8"><title>Agentic OBS browser display</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#f5f7ed;font-family:Arial,Helvetica,sans-serif;overflow:hidden;--accent:#d6ff6b}#stage{height:100vh;position:relative;padding:5vh 4vw}.preview{background:radial-gradient(ellipse at 50% 40%,#333e2b,#151a12)}#camera{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#627052;letter-spacing:.4vw;font-size:1.3vw}.preview #camera{display:flex}#label{position:absolute;top:6vh;left:4vw;font-size:1vw;letter-spacing:.25vw;color:var(--accent)}#lower{position:absolute;bottom:9vh;left:4vw;max-width:85%;border-left:.5vw solid var(--accent);padding-left:2vw;transition:all .4s}h1{font-size:4.6vw;letter-spacing:-.18vw;line-height:1.04;margin:0;text-wrap:balance}p{font-size:1.8vw;color:#c7d0bf;margin:1.6vh 0 0}#cue{position:absolute;right:4vw;top:6vh;text-align:right;color:var(--accent);max-width:70%;font-size:3vw;font-weight:bold}#timer{font-size:7vw;display:block;font-variant-numeric:tabular-nums}.focus #lower,.break #lower{bottom:35vh}.focus #camera,.break #camera{display:none}.break{background:#182013}#offline{position:absolute;top:0;left:0;font-size:14px;color:#ffb98b}</style><body><div id="stage"><div id="camera">CAMERA SOURCE SITS UNDER THIS PAGE IN OBS</div><div id="label">LIVE / YOUR SHOW</div><div id="lower"><h1 id="title"></h1><p id="subtitle"></p></div><div id="cue"><span id="cueText"></span><span id="timer"></span></div><div id="offline"></div></div><script>const stage=document.querySelector('#stage');if(new URLSearchParams(location.search).has('preview'))document.body.className='preview';let d={};async function poll(){try{let r=await fetch('/api/state');if(!r.ok)throw Error();let s=await r.json();d=s.display;stage.className=d.layout;document.documentElement.style.setProperty('--accent',{lime:'#d6ff6b',pink:'#ff9ad0',white:'#ffffff'}[d.accent]);for(let k of ['title','subtitle'])document.getElementById(k).textContent=d[k];document.querySelector('#cueText').textContent=d.cue;document.querySelector('#offline').textContent='';document.body.dataset.revision=s.revision}catch(e){document.querySelector('#offline').textContent='CONNECTOR OFFLINE'}}setInterval(poll,250);setInterval(()=>{document.querySelector('#timer').textContent=d.until?Math.max(0,Math.ceil(d.until-Date.now()/1000)):''},100);poll();</script></body></html>
